<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍣 Sushi Clicker</title>
<style>
  :root{
    --bg:#14101a; --panel:#1e1626; --panel2:#251b30; --line:#3a2b4d;
    --gold:#ffcf5c; --red:#ff5a6e; --green:#7dff9e; --text:#f5ecdd; --dim:#b9a8cc;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{background:radial-gradient(1200px 600px at 20% -10%,#2c1f3d 0%,var(--bg) 60%) fixed,var(--bg); color:var(--text); font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif; min-height:100vh;}
  .topbar{display:flex; justify-content:space-between; align-items:center; padding:12px 18px; background:linear-gradient(180deg,#241a30,#1a1322); border-bottom:2px solid var(--line); position:sticky; top:0; z-index:20;}
  .logo{font-size:24px; font-weight:800; letter-spacing:.5px;}
  .logo small{font-size:12px; color:var(--dim); font-weight:400; margin-left:8px;}
  .top-actions button{background:#2e2240; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:8px 12px; cursor:pointer; font-size:14px; margin-left:8px;}
  .top-actions button:hover{background:#3a2c52;}
  .ticker{background:#0f0b14; border-bottom:1px solid var(--line); padding:8px 16px; font-style:italic; color:var(--dim); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #buffBar{display:flex; gap:8px; padding:8px 16px; flex-wrap:wrap;}
  .buff{background:linear-gradient(180deg,#5b3a00,#3a2700); border:1px solid var(--gold); color:var(--gold); border-radius:8px; padding:4px 10px; font-size:13px; font-weight:700;}
  .game{display:grid; grid-template-columns:400px 1fr; gap:16px; padding:16px; max-width:1200px; margin:0 auto;}
  @media(max-width:850px){.game{grid-template-columns:1fr;}}
  .panel{background:linear-gradient(180deg,var(--panel),#191223); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:0 10px 30px rgba(0,0,0,.4);}
  .counter{text-align:center; margin-bottom:10px;}
  #sushiCount{font-size:34px; font-weight:900; color:var(--gold); text-shadow:0 2px 0 #5c4300;}
  #perSecond,#perClick{color:var(--dim); font-size:14px; margin-top:2px;}
  #bigSushiWrap{position:relative; display:flex; justify-content:center; padding:18px 0 10px;}
  #bigSushi{font-size:150px; width:260px; height:260px; border-radius:50%; border:6px solid #4a335f; cursor:pointer; background:radial-gradient(circle at 35% 30%,#3d2c52,#1c1426 70%); line-height:1; transition:transform .06s; filter:drop-shadow(0 0 25px rgba(255,90,110,.35)); user-select:none;}
  #bigSushi:hover{filter:drop-shadow(0 0 35px rgba(255,207,92,.5));}
  #bigSushi:active{transform:scale(.93);}
  #bigSushiWrap.pulse #bigSushi{animation:pulse .15s;}
  @keyframes pulse{50%{transform:scale(1.05);}}
  .float{position:absolute; font-weight:900; color:#fff; text-shadow:0 2px 4px #000; pointer-events:none; animation:rise 1s ease-out forwards; font-size:20px; z-index:5;}
  @keyframes rise{to{transform:translateY(-120px); opacity:0;}}
  #soyLevel{text-align:center; background:#12241a; border:1px solid #2c5c40; border-radius:10px; padding:8px; font-size:13px; margin-top:8px; color:var(--green);}
  .stats-mini{text-align:center; color:var(--dim); font-size:12px; margin-top:10px; line-height:1.7;}
  .tabs{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
  .tabs button{flex:1; min-width:110px; background:#2a1f3a; color:var(--text); border:1px solid var(--line); padding:10px; border-radius:10px; cursor:pointer; font-weight:700;}
  .tabs button.active{background:var(--red); border-color:var(--red); color:#fff;}
  .buybar{display:flex; gap:6px; margin-bottom:12px; align-items:center; font-size:13px; color:var(--dim);}
  .buybar button{background:#2e2240; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; font-weight:700;}
  .buybar button.active{background:var(--gold); color:#000; border-color:var(--gold);}
  .bld{display:flex; align-items:center; gap:12px; background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; cursor:pointer; transition:background .1s;}
  .bld:hover:not(.locked):not(.cant){background:#31223f;}
  .bld .em{font-size:38px; width:52px; text-align:center;}
  .bld .info{flex:1;}
  .bld .info b{font-size:15px;}
  .bld .info div{font-size:12px; color:var(--dim);}
  .bld .own{font-size:32px; font-weight:900; color:var(--gold); opacity:.9;}
  .bld .cost{font-size:13px; color:var(--green); font-weight:700;}
  .bld.cant{opacity:.55; cursor:not-allowed;}
  .bld.locked{opacity:.35; filter:grayscale(1); cursor:not-allowed;}
  .upgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px;}
  .up{background:#2b2138; border:1px solid var(--gold); border-radius:10px; padding:10px; cursor:pointer; font-size:13px;}
  .up:hover{background:#3a2c4d;}
  .up .em{font-size:28px;}
  .up b{display:block; margin:4px 0;}
  .up small{color:var(--dim);}
  .up .cost{color:var(--green); font-weight:700; margin-top:4px; display:block;}
  .statrow{display:flex; justify-content:space-between; border-bottom:1px dashed var(--line); padding:6px 0; font-size:14px;}
  .ach{background:#241b31; border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:6px; font-size:13px;}
  .ach.won{border-color:var(--gold);}
  .ach span{float:right;}
  #golden{position:fixed; font-size:64px; cursor:pointer; display:none; z-index:50; filter:drop-shadow(0 0 20px gold); animation:wob 1s infinite alternate;}
  @keyframes wob{to{transform:scale(1.15) rotate(8deg);}}
  #toasts{position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:60; display:flex; flex-direction:column; gap:8px; align-items:center;}
  .toast{background:#000d; border:1px solid var(--gold); color:var(--gold); padding:10px 18px; border-radius:12px; font-weight:700; animation:rise 3s forwards;}
  .hint{font-size:12px; color:var(--dim); text-align:center; margin-top:10px;}
  button:focus-visible{outline:2px solid var(--gold);}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">🍣 Sushi Clicker <small>like cookie clicker, but raw</small></div>
  <div class="top-actions">
    <button id="muteBtn" title="sound">🔊</button>
    <button id="saveBtn">💾 Save</button>
    <button id="expBtn">📤 Export</button>
    <button id="impBtn">📥 Import</button>
    <button id="resetBtn">🗑 Reset</button>
  </div>
</div>
<div class="ticker">📰 <span id="newsText">Welcome to Sushi Clicker! Click the big sushi.</span></div>
<div id="buffBar"></div>
<main class="game">
  <section class="panel">
    <div class="counter">
      <div id="sushiCount">0 sushi</div>
      <div id="perSecond">per second: 0</div>
      <div id="perClick">per click: 1</div>
    </div>
    <div id="bigSushiWrap"><button id="bigSushi" aria-label="click for sushi">🍣</button></div>
    <div id="soyLevel">🍶 Soy Sauce: Level 0 (CPS +0%)</div>
    <div class="stats-mini" id="statsMini"></div>
    <div class="hint">Tip: golden sushi appears sometimes — click it fast! ✨</div>
  </section>
  <section class="panel">
    <div class="tabs">
      <button id="tabB" class="active">🏠 Farm</button>
      <button id="tabU">⬆️ Upgrades <span id="upBadge"></span></button>
      <button id="tabS">📊 Stats</button>
    </div>
    <div id="pageB">
      <div class="buybar">Buy: 
        <button data-amt="1" class="active">x1</button>
        <button data-amt="10">x10</button>
        <button data-amt="100">x100</button>
        <button data-amt="max">Max</button>
      </div>
      <div id="buildingList"></div>
    </div>
    <div id="pageU" style="display:none">
      <div class="upgrid" id="upgradeList"></div>
    </div>
    <div id="pageS" style="display:none">
      <div id="statsPanel"></div>
      <h3 style="margin:12px 0 8px">🏆 Achievements (<span id="achCount">0</span>)</h3>
      <div id="achList"></div>
    </div>
  </section>
</main>
<div id="golden">🍣</div>
<div id="toasts"></div>
<script>
'use strict';
/* ---------- DATA ---------- */
const BUILDINGS=[
  {id:'chop', name:'Apprentice Chopsticks', emoji:'🥢', desc:'Auto-picks sushi for you.', baseCost:15, baseCps:0.1},
  {id:'kitchen', name:'Home Kitchen', emoji:'🍳', desc:'Rolls maki on the stove.', baseCost:100, baseCps:1},
  {id:'chef', name:'Sushi Chef', emoji:'👨‍🍳', desc:'A trained master. Fast hands.', baseCost:1100, baseCps:8},
  {id:'boat', name:'Fishing Boat', emoji:'🎣', desc:'Fresh fish straight from the sea.', baseCost:12000, baseCps:47},
  {id:'rice', name:'Rice Paddy Farm', emoji:'🌾', desc:'Endless perfect rice.', baseCost:130000, baseCps:260},
  {id:'tuna', name:'Tuna Farm', emoji:'🐟', desc:'Fat bluefin, on demand.', baseCost:1400000, baseCps:1400},
  {id:'train', name:'Sushi Train', emoji:'🚂', desc:'Conveyor-belt deliciousness.', baseCost:20000000, baseCps:7800},
  {id:'factory', name:'Sushi Factory', emoji:'🏭', desc:'Industrial-grade nigiri.', baseCost:330000000, baseCps:44000},
  {id:'wasabi', name:'Wasabi Lab', emoji:'🧪', desc:'Science with a kick.', baseCost:5100000000, baseCps:260000},
  {id:'portal', name:'Salmon Portal', emoji:'🌀', desc:'Summons salmon from another dimension.', baseCost:75000000000, baseCps:1600000},
  {id:'temple', name:'Dragon Roll Temple', emoji:'🐉', desc:'Ancient sushi gods smile on you.', baseCost:1000000000000, baseCps:10000000},
];
const STATIC_UPGRADES=[
  {id:'click1', name:'Reinforced Chopsticks', icon:'🥢', desc:'Clicking gains +1 sushi.', cost:100, req:s=>s.totalClicks>=15},
  {id:'click2', name:'Titanium Chopsticks', icon:'🍴', desc:'Click power x2.', cost:5000, req:s=>s.totalClicks>=100},
  {id:'click3', name:'Wasabi Fingers', icon:'🌶️', desc:'Clicking gains +5 sushi.', cost:500000, req:s=>s.handmade>=5000},
  {id:'click4', name:'Dragon Grip', icon:'🐲', desc:'Click power x2.', cost:50000000, req:s=>s.handmade>=50000},
  {id:'click5', name:'Golden Palms', icon:'🙌', desc:'Click gains +15% of your CPS.', cost:5000000000, req:s=>s.handmade>=500000},
  {id:'soy1', name:'Soy Sauce Glaze', icon:'🍶', desc:'All production x1.5.', cost:1000000, req:s=>s.totalEarned>=800000},
  {id:'soy2', name:'Premium Nori', icon:'🌿', desc:'All production x2.', cost:100000000, req:s=>s.totalEarned>=50000000},
  {id:'soy3', name:'Omakase Spirit', icon:'👺', desc:'All production x2.', cost:10000000000, req:s=>s.totalEarned>=5000000000},
];
BUILDINGS.forEach(b=>{
  STATIC_UPGRADES.push({id:b.id+'-m1', building:b.id, mult:2, name:b.name+' Mastery I', icon:b.emoji, desc:b.name+'s are twice as efficient.', cost:b.baseCost*12, req:s=>(s.buildings[b.id]||0)>=10});
  STATIC_UPGRADES.push({id:b.id+'-m2', building:b.id, mult:2, name:b.name+' Mastery II', icon:b.emoji, desc:b.name+'s are twice as efficient.', cost:b.baseCost*250, req:s=>(s.buildings[b.id]||0)>=50});
});
const UPGRADES=STATIC_UPGRADES;
const ACH=[
  {id:'c1', name:'First Bite', desc:'Click 10 times.', check:s=>s.totalClicks>=10},
  {id:'c2', name:'Chopstick Pro', desc:'Click 500 times.', check:s=>s.totalClicks>=500},
  {id:'c3', name:'Carpal Tunnel', desc:'Click 5,000 times.', check:s=>s.totalClicks>=5000},
  {id:'e1', name:'Maki Beginner', desc:'Bake 1,000 sushi total.', check:s=>s.totalEarned>=1000},
  {id:'e2', name:'Roll Dealer', desc:'Bake 1M sushi total.', check:s=>s.totalEarned>=1e6},
  {id:'e3', name:'Sushi Millionaire', desc:'Bake 100M sushi total.', check:s=>s.totalEarned>=1e8},
  {id:'e4', name:'Sushi Empire', desc:'Bake 10B sushi total.', check:s=>s.totalEarned>=1e10},
  {id:'p1', name:'Nice Spread', desc:'10 sushi per second.', check:()=>cps()>=10},
  {id:'p2', name:'Conveyor Belt', desc:'500 sushi per second.', check:()=>cps()>=500},
  {id:'p3', name:'Fish Volcano', desc:'50,000 sushi per second.', check:()=>cps()>=50000},
  {id:'b1', name:'Small Family', desc:'Own 10 buildings.', check:s=>totalBuildings(s)>=10},
  {id:'b2', name:'Franchise', desc:'Own 75 buildings.', check:s=>totalBuildings(s)>=75},
  {id:'b3', name:'Zaibatsu', desc:'Own 200 buildings.', check:s=>totalBuildings(s)>=200},
  {id:'g1', name:'Golden Catch', desc:'Click 1 golden sushi.', check:s=>(s.golden||0)>=1},
  {id:'g2', name:'Shiny Hunter', desc:'Click 7 golden sushi.', check:s=>(s.golden||0)>=7},
];
const NEWS=[
  'News: local chef claims sushi "just hits different when you click it".',
  'News: scientists confirm clicking sushi burns exactly 0 calories.',
  'News: tuna stocks rise as demand from clickers explodes.',
  'News: wasabi shortage blamed on "some guy clicking too fast".',
  'News: dragon spotted guarding a sushi temple. Locals unbothered.',
  'News: soy sauce sales up 400%. Nobody knows why.',
  'Tip: buying in x10 bulk is often the best value.',
  'Tip: upgrades in the ⬆️ tab multiply your farms forever.',
  'Tip: golden sushi brings frenzies. Keep an eye out!',
];
/* ---------- STATE ---------- */
const SAVE_KEY='sushiClickerSaveV1';
let state=fresh();
function fresh(){return{sushi:0,totalEarned:0,totalClicks:0,handmade:0,buildings:{},upgrades:{},ach:{},golden:0,playSec:0,muted:false,started:Date.now()};}
let buyAmt=1, frenzyUntil=0, clickFrenzyUntil=0, audioCtx=null;
function totalBuildings(s){return Object.values(s.buildings).reduce((a,b)=>a+b,0);}
/* ---------- HELPERS ---------- */
const $=id=>document.getElementById(id);
function fmt(n){
  if(n<1000)return Math.floor(n).toString();
  const u=['K','M','B','T','Qa','Qi','Sx','Sp','Oc','No'];
  let i=-1,v=n;
  while(v>=1000&&i<u.length-1){v/=1000;i++;}
  return (v>=100?v.toFixed(0):v>=10?v.toFixed(1):v.toFixed(2))+u[i];
}
function buildingCost(b,owned,qty){
  let c=0;
  for(let i=0;i<qty;i++)c+=b.baseCost*Math.pow(1.15,owned+i);
  return c;
}
function maxAffordable(b,owned,money){
  let q=0,c=0;
  while(q<1000){const n=b.baseCost*Math.pow(1.15,owned+q); if(c+n>money)break; c+=n; q++;}
  return{q,cost:c};
}
function buildingMult(id){
  let m=1;
  for(const u of UPGRADES)if(u.building===id&&state.upgrades[u.id])m*=u.mult;
  return m;
}
function achCount(){return Object.keys(state.ach).length;}
function soyBonus(){return 1+Math.floor(achCount()/3)*0.02;}
function rawCps(){
  let s=0;
  for(const b of BUILDINGS)s+=(state.buildings[b.id]||0)*b.baseCps*buildingMult(b.id);
  let g=1;
  if(state.upgrades.soy1)g*=1.5;
  if(state.upgrades.soy2)g*=2;
  if(state.upgrades.soy3)g*=2;
  return s*g*soyBonus();
}
function cps(){
  let v=rawCps();
  if(Date.now()<frenzyUntil)v*=7;
  return v;
}
function clickBase(){
  let p=1;
  if(state.upgrades.click1)p+=1;
  if(state.upgrades.click3)p+=5;
  if(state.upgrades.click2)p*=2;
  if(state.upgrades.click4)p*=2;
  return p;
}
function clickGain(){let g=clickBase(); if(state.upgrades.click5)g+=rawCps()*0.15; if(Date.now()<clickFrenzyUntil)g*=777; return g;}
function pop(){
  if(state.muted)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value=400+Math.random()*300; o.type='sine';
    g.gain.setValueAtTime(0.08,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.09);
    o.start(); o.stop(audioCtx.currentTime+0.1);
  }catch(e){}
}
function toast(msg){const d=document.createElement('div'); d.className='toast'; d.textContent=msg; $('toasts').appendChild(d); setTimeout(()=>d.remove(),3000);}
/* ---------- ACTIONS ---------- */
function doClick(ev){
  const g=clickGain();
  state.sushi+=g; state.totalEarned+=g; state.handmade+=g; state.totalClicks++;
  pop();
  const w=$('bigSushiWrap');
  w.classList.remove('pulse'); void w.offsetWidth; w.classList.add('pulse');
  const f=document.createElement('div');
  f.className='float'; f.textContent='+'+fmt(g);
  const r=w.getBoundingClientRect();
  f.style.left=(r.width/2+(Math.random()*120-60))+'px';
  f.style.top='60px';
  w.appendChild(f); setTimeout(()=>f.remove(),1000);
  updateHUD();
}
function buyBuilding(id){
  const b=BUILDINGS.find(x=>x.id===id);
  const owned=state.buildings[id]||0;
  let q,cost;
  if(buyAmt==='max'){const r=maxAffordable(b,owned,state.sushi); q=r.q; cost=r.cost;}
  else{q=buyAmt; cost=buildingCost(b,owned,q);}
  if(q<1||state.sushi<cost){pop(); return;}
  state.sushi-=cost; state.buildings[id]=owned+q;
  pop(); renderShop(); updateHUD(); save();
}
function buyUpgrade(id){
  const u=UPGRADES.find(x=>x.id===id);
  if(!u||state.upgrades[id]||state.sushi<u.cost)return;
  state.sushi-=u.cost; state.upgrades[id]=true;
  toast(u.icon+' '+u.name+' unlocked!'); pop();
  renderShop(); updateHUD(); save();
}
function availableUpgrades(){return UPGRADES.filter(u=>!state.upgrades[u.id]&&u.req(state));}
/* ---------- GOLDEN SUSHI ---------- */
function goldenLoop(){
  const wait=75000+Math.random()*105000;
  setTimeout(()=>{
    if(document.hidden){goldenLoop(); return;}
    showGolden(); goldenLoop();
  },wait);
}
function showGolden(){
  const g=$('golden');
  g.style.display='block';
  g.style.left=(10+Math.random()*80)+'vw';
  g.style.top=(15+Math.random()*65)+'vh';
  const t=setTimeout(hideGolden,13000);
  g.onclick=()=>{
    clearTimeout(t); hideGolden();
    state.golden=(state.golden||0)+1;
    const roll=Math.random(), bank=state.sushi, base=Math.max(rawCps(),1);
    if(roll<0.4){frenzyUntil=Date.now()+30000; toast('✨ FRENZY! CPS x7 for 30s!');}
    else if(roll<0.75){const bonus=Math.min(bank*0.15,base*900)+13; state.sushi+=bonus; state.totalEarned+=bonus; toast('✨ LUCKY! +'+fmt(bonus)+' sushi!');}
    else if(roll<0.9){clickFrenzyUntil=Date.now()+15000; toast('✨ CLICK FRENZY! Clicks x777 for 15s!');}
    else{const bonus=base*60; state.sushi+=bonus; state.totalEarned+=bonus; toast('✨ SUSHI RUSH! +'+fmt(bonus)+' sushi (60s of production)!');}
    pop(); checkAch(); updateHUD(); save();
  };
}
function hideGolden(){$('golden').style.display='none'; $('golden').onclick=null;}
/* ---------- RENDER ---------- */
function updateHUD(){
  $('sushiCount').textContent=fmt(state.sushi)+' sushi';
  $('perSecond').textContent='per second: '+fmt(cps());
  $('perClick').textContent='per click: '+fmt(clickGain());
  const lvl=Math.floor(achCount()/3);
  $('soyLevel').textContent='🍶 Soy Sauce: Level '+lvl+' (CPS +'+(lvl*2)+'%) — '+achCount()+' achievements';
  const mins=Math.floor(state.playSec/60), secs=state.playSec%60;
  $('statsMini').innerHTML='total baked: <b>'+fmt(state.totalEarned)+'</b> 🍣<br>handmade: '+fmt(state.handmade)+' • clicks: '+fmt(state.totalClicks)+'<br>buildings: '+totalBuildings(state)+' • golden: '+(state.golden||0)+'<br>time: '+mins+'m '+secs+'s';
  const bb=$('buffBar'); bb.innerHTML='';
  if(Date.now()<frenzyUntil){const s=Math.ceil((frenzyUntil-Date.now())/1000); bb.innerHTML+='<div class="buff">✨ FRENZY x7 — '+s+'s</div>';}
  if(Date.now()<clickFrenzyUntil){const s=Math.ceil((clickFrenzyUntil-Date.now())/1000); bb.innerHTML+='<div class="buff">👆 CLICK x777 — '+s+'s</div>';}
}
function renderShop(){
  const bl=$('buildingList'); bl.innerHTML='';
  for(const b of BUILDINGS){
    const owned=state.buildings[b.id]||0;
    const seen=state.totalEarned>=b.baseCost*0.25||owned>0;
    let q=buyAmt==='max'?maxAffordable(b,owned,state.sushi).q:buyAmt;
    if(q<1)q=1;
    const cost=buyAmt==='max'?maxAffordable(b,owned,state.sushi).cost:buildingCost(b,owned,q);
    const cant=state.sushi<cost;
    const d=document.createElement('div');
    d.className='bld'+(cant?' cant':'')+(seen?'':' locked');
    d.innerHTML='<div class="em">'+(seen?b.emoji:'❓')+'</div><div class="info"><b>'+(seen?b.name:'???')+'</b><div>'+(seen?b.desc+'<br>each: '+fmt(b.baseCps*buildingMult(b.id))+'/s • total: '+fmt(owned*b.baseCps*buildingMult(b.id))+'/s':'Bake more sushi to discover.')+'</div><div class="cost">'+(seen?(buyAmt==='max'?'buy max ('+maxAffordable(b,owned,state.sushi).q+')':'buy x'+q)+' — 🍣 '+fmt(cost):'')+'</div></div><div class="own">'+(owned||'')+'</div>';
    if(seen&&!cant)d.onclick=()=>buyBuilding(b.id);
    bl.appendChild(d);
  }
  const ul=$('upgradeList'); ul.innerHTML='';
  const av=availableUpgrades();
  $('upBadge').textContent=av.length?'('+av.length+')':'';
  if(!av.length)ul.innerHTML='<p style="color:var(--dim)">No upgrades available yet. Keep baking! 🍣</p>';
  for(const u of av){
    const cant=state.sushi<u.cost;
    const d=document.createElement('div');
    d.className='up'; d.style.opacity=cant?'.6':'1';
    d.innerHTML='<div class="em">'+u.icon+'</div><b>'+u.name+'</b><small>'+u.desc+'</small><span class="cost">🍣 '+fmt(u.cost)+'</span>';
    if(!cant)d.onclick=()=>buyUpgrade(u.id);
    ul.appendChild(d);
  }
  renderStats();
}
function renderStats(){
  const ownedUp=Object.keys(state.upgrades).length;
  $('statsPanel').innerHTML=
    row('Sushi in bank',fmt(state.sushi))+row('Total baked (all time)',fmt(state.totalEarned))+
    row('Sushi per second',fmt(cps()))+row('Sushi per click',fmt(clickGain()))+
    row('Buildings owned',totalBuildings(state))+row('Upgrades owned',ownedUp+' / '+UPGRADES.length)+
    row('Golden sushi clicked',state.golden||0)+row('Total clicks',state.totalClicks);
  const al=$('achList'); al.innerHTML='';
  $('achCount').textContent=achCount()+' / '+ACH.length;
  for(const a of ACH){
    const won=!!state.ach[a.id];
    const d=document.createElement('div');
    d.className='ach'+(won?' won':'');
    d.innerHTML=(won?'🏆 ':'🔒 ')+'<b>'+a.name+'</b> — '+a.desc+'<span>'+(won?'✓':'')+'</span>';
    al.appendChild(d);
  }
}
function row(k,v){return '<div class="statrow"><span>'+k+'</span><b>'+v+'</b></div>';}
function checkAch(){
  for(const a of ACH){
    if(!state.ach[a.id]){
      try{if(a.check(state)){state.ach[a.id]=true; toast('🏆 '+a.name+' — '+a.desc);}}catch(e){}
    }
  }
}
/* ---------- SAVE ---------- */
function save(){try{state.playSec=state.playSec||0; localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch(e){}}
function load(){try{const s=localStorage.getItem(SAVE_KEY); if(!s)return; const p=JSON.parse(s); state=Object.assign(fresh(),p);}catch(e){}}
/* ---------- WIRE UP ---------- */
$('bigSushi').addEventListener('pointerdown',doClick);
document.querySelectorAll('.buybar button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.buybar button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); buyAmt=b.dataset.amt==='max'?'max':parseInt(b.dataset.amt,10); renderShop();});
function setTab(which){
  $('tabB').classList.toggle('active',which==='B');
  $('tabU').classList.toggle('active',which==='U');
  $('tabS').classList.toggle('active',which==='S');
  $('pageB').style.display=which==='B'?'':'none';
  $('pageU').style.display=which==='U'?'':'none';
  $('pageS').style.display=which==='S'?'':'none';
}
$('tabB').onclick=()=>setTab('B'); $('tabU').onclick=()=>setTab('U'); $('tabS').onclick=()=>{setTab('S'); renderStats();};
$('muteBtn').onclick=()=>{state.muted=!state.muted; $('muteBtn').textContent=state.muted?'🔇':'🔊'; save();};
$('saveBtn').onclick=()=>{save(); toast('💾 Saved!');};
$('resetBtn').onclick=()=>{if(confirm('Throw away ALL your sushi and start over?')){localStorage.removeItem(SAVE_KEY); state=fresh(); frenzyUntil=0; clickFrenzyUntil=0; renderShop(); updateHUD(); toast('🗑 Fresh start!');}};
$('expBtn').onclick=()=>{save(); prompt('Copy your save (Ctrl+C):',btoa(unescape(encodeURIComponent(JSON.stringify(state)))));};
$('impBtn').onclick=()=>{const s=prompt('Paste your save:'); if(!s)return; try{state=Object.assign(fresh(),JSON.parse(decodeURIComponent(escape(atob(s))))); renderShop(); updateHUD(); save(); toast('📥 Save loaded!');}catch(e){alert('Invalid save.');}};
window.addEventListener('beforeunload',save);
/* news */
let ni=0; setInterval(()=>{ni=(ni+1)%NEWS.length; let t=NEWS[ni]; if(ni===0&&totalBuildings(state)>0)t='News: local clicker owns '+totalBuildings(state)+' buildings and '+fmt(state.sushi)+' sushi. Neighbors jealous.'; $('newsText').textContent=t;},10000);
/* main loops */
load();
$('muteBtn').textContent=state.muted?'🔇':'🔊';
renderShop(); updateHUD(); checkAch();
setInterval(()=>{ // 10 ticks/sec
  const gain=cps()/10;
  state.sushi+=gain; state.totalEarned+=gain; state.playSec+=0; 
  updateHUD();
},100);
setInterval(()=>{state.playSec+=1; checkAch(); renderShop(); updateHUD();},1000);
setInterval(save,15000);
goldenLoop();
</script>
</body>
</html>
